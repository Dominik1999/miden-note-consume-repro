[package]
name = "miden-note-consume-repro"
version = "0.1.0"
edition = "2021"

[dependencies]
miden-client = { version = "0.14", features = ["testing", "tonic"] }
miden-client-sqlite-store = "0.14"
miden-protocol = "0.14"
