[package]
name = "miden-note-consume-repro"
version = "0.1.0"
edition = "2021"

[dependencies]
# Pinned to main to include MMR sync fix (not yet released on crates.io)
miden-client = { git = "https://github.com/0xMiden/miden-client.git", branch = "main", features = ["testing", "tonic"] }
miden-client-sqlite-store = { git = "https://github.com/0xMiden/miden-client.git", branch = "main" }
miden-protocol = "0.14"
miden-testing = "0.14"
miden-standards = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
rand = "0.9"
rand_chacha = "0.9"
anyhow = "1"
tempfile = "3"
base64 = "0.22"
toml = "0.8"
